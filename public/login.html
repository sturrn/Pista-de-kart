<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>
<body>
    <main>
        <a href="index.html">TURBO KART</a>
        <section class="login">
            <h1>Entrar</h1>
            <p>Acesse sua conta</p>
            <form id="login-form">
                <input type="email" id="email-login" placeholder="Digite seu email..." autocomplete="username" required>
                <input type="password" id="senha-login" placeholder="Digite sua senha..." autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="login-feedback" role="alert" aria-live="polite"></p>
            <p class="cadastro-via-login">Ainda não tem uma conta 
                <a href="cadastro.html">Faça Agora e Cadastre!</a>
            </p>

        </section>
    </main>

    <footer>
        <p>TURBO KART</p>
        <p>Todos os Direitos reservados &copy; 2026</p>
    </footer>
        <script src="js/api.js"></script>
        <script src="js/login.js"></script>

</body>
</html>
